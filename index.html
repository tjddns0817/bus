<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논현구월노선</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 14px;
      line-height: 1.45;
    }
    .header {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .route-title {
      font-size: 18px;
      font-weight: 800;
    }
    .gps-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #065f46;
      color: #a7f3d0;
      font-weight: 700;
    }
    .gps-badge.warn {
      background: #78350f;
      color: #fde68a;
    }
    .next-box {
      background: #1e3a8a;
      border: 2px solid #60a5fa;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .next-label {
      font-size: 12px;
      color: #bfdbfe;
      font-weight: 700;
    }
    .next-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin: 4px 0 2px;
    }
    .next-addr {
      font-size: 12px;
      color: #dbeafe;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-kakao {
      background: #fee500;
      color: #191919;
      width: 100%;
      font-size: 15px;
      padding: 12px;
    }
    .btn-sub {
      background: #374151;
      color: #f9fafb;
      font-size: 12px;
      padding: 8px 11px;
    }
    .btn-mini-kakao {
      background: #fee500;
      color: #191919;
      font-size: 12px;
      padding: 8px 11px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stop-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stop-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .stop-card.passed {
      opacity: 0.55;
      border-color: #10b981;
    }
    .stop-card.current-target {
      background: #172554;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }
    .stop-num {
      display: inline-block;
      min-width: 26px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: #374151;
      margin-right: 6px;
    }
    .current-target .stop-num {
      background: #38bdf8;
      color: #0f172a;
    }
    .stop-name {
      font-size: 16px;
      font-weight: 700;
    }
    .stop-meta {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 106px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="route-title">논현구월노선</div>
      <div id="gpsStatus" class="gps-badge warn">GPS 대기 중</div>
    </div>
    <div id="gpsCoord" style="font-size: 12px; color: #9ca3af;">총 19곳 · 위치 권한을 허용하면 좌표 입력된 정류장까지 거리를 계산합니다.</div>

    <div class="next-box">
      <div class="next-label">다음 강조 정류장</div>
      <div id="nextStopTitle" class="next-title">1번 정류장</div>
      <div id="nextStopAddr" class="next-addr"></div>
      <button id="nextNaviBtn" class="btn btn-kakao" type="button">카카오내비로 다음 정류장 안내</button>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn" class="btn btn-sub" type="button">이전 정류장 강조</button>
    <button id="nextBtn" class="btn btn-sub" type="button">다음 정류장 강조</button>
    <button id="resetBtn" class="btn btn-sub" type="button">처음부터 초기화</button>
  </div>

  <div id="stopList" class="stop-list"></div>

  <script>
    const STOPS = [
      { name: "도림육교", address: "인천 남동구 도림동 242", time: "", lat: null, lng: null },
      { name: "논현14단지", address: "인천 남동구 논현동 109-224", time: "", lat: null, lng: null },
      { name: "논현11단지", address: "인천 남동구 논현동 694", time: "", lat: null, lng: null },
      { name: "논현8단지", address: "인천 남동구 논현동 698", time: "", lat: null, lng: null },
      { name: "논현7단지", address: "인천 남동구 논현동 618-1", time: "", lat: null, lng: null },
      { name: "논현5단지", address: "인천광역시 남동구 논현로 105", time: "", lat: null, lng: null },
      { name: "논현3단지", address: "인천 남동구 논현동 709", time: "", lat: null, lng: null },
      { name: "논현숲속마을", address: "인천 남동구 논현동 465-5", time: "", lat: null, lng: null },
      { name: "논현주공육교", address: "인천 남동구 논현동 574", time: "", lat: null, lng: null },
      { name: "남촌동", address: "인천 남동구 남촌동 82-5", time: "", lat: null, lng: null },
      { name: "구월선수촌", address: "인천 남동구 구월동 1583", time: "", lat: null, lng: null },
      { name: "구월동길병원", address: "인천 남동구 구월동 1336", time: "", lat: null, lng: null },
      { name: "구월동길병원고개", address: "인천 남동구 구월동 27", time: "", lat: null, lng: null },
      { name: "간석동 자이", address: "인천 남동구 간석동 939-8", time: "", lat: null, lng: null },
      { name: "(구)경복예식장", address: "인천 남동구 간석동 272-3", time: "", lat: null, lng: null },
      { name: "간석역", address: "인천 미추홀구 주안동 883", time: "", lat: null, lng: null },
      { name: "주안남부역", address: "인천광역시 미추홀구 주안로 89", time: "", lat: null, lng: null },
      { name: "동원아파트", address: "인천 미추홀구 도화동 566-2", time: "", lat: null, lng: null },
      { name: "현대제철", address: "인천광역시 제물포구 중봉대로 63", time: "", lat: null, lng: null }
    ];

    const ARRIVAL_RADIUS_METERS = 80;
    let activeIndex = 0;
    let passedSet = new Set();
    let latestDistances = new Array(STOPS.length).fill(null);

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function openKakaoNavi(stop) {
      const queryText = stop.address || stop.name;
      const encodedQuery = encodeURIComponent(queryText);

      if (typeof stop.lat === "number" && typeof stop.lng === "number") {
        const label = stop.name || stop.address;
        const appUrl = `kakaonavi://navigate?name=${encodeURIComponent(label)}&x=${stop.lng}&y=${stop.lat}&coordType=wgs84`;
        const webUrl = `https://map.kakao.com/link/to/${encodeURIComponent(label)},${stop.lat},${stop.lng}`;
        const start = Date.now();
        window.location.href = appUrl;
        setTimeout(() => {
          if (Date.now() - start < 1800 && !document.hidden) {
            window.open(webUrl, "_blank", "noopener");
          }
        }, 1000);
      } else {
        const searchWebUrl = `https://map.kakao.com/link/search/${encodedQuery}`;
        window.open(searchWebUrl, "_blank", "noopener");
      }
    }

    function render() {
      const nextStop = STOPS[activeIndex] || STOPS[0];
      const displayName = nextStop.name || nextStop.address;
      const distText = latestDistances[activeIndex] != null
        ? ` · 약 ${Math.round(latestDistances[activeIndex])}m`
        : "";
      const timeText = nextStop.time ? ` (${nextStop.time})` : "";

      document.getElementById("nextStopTitle").textContent =
        `${activeIndex + 1}번 ${displayName}${timeText}${distText}`;
      document.getElementById("nextStopAddr").textContent = nextStop.address || "";

      const nextBtn = document.getElementById("nextNaviBtn");
      nextBtn.onclick = () => openKakaoNavi(nextStop);

      const listEl = document.getElementById("stopList");
      listEl.innerHTML = "";

      STOPS.forEach((stop, idx) => {
        const card = document.createElement("div");
        card.className = "stop-card";
        if (idx === activeIndex) card.classList.add("current-target");
        else if (passedSet.has(idx)) card.classList.add("passed");

        const d = latestDistances[idx];
        const distStr = d != null
          ? ` · 거리 ${d >= 1000 ? (d / 1000).toFixed(1) + "km" : Math.round(d) + "m"}`
          : "";
        const statusStr = passedSet.has(idx)
          ? " · 통과/도착"
          : (idx === activeIndex ? " · 다음 안내 대상" : "");
        const timeStr = stop.time ? `예정 ${stop.time} · ` : "";

        const info = document.createElement("div");
        info.innerHTML = `
          <div><span class="stop-num">${idx + 1}</span><span class="stop-name">${stop.name || stop.address}</span></div>
          <div class="stop-meta">${timeStr}${stop.address}${distStr}${statusStr}</div>
        `;

        const actions = document.createElement("div");
        actions.className = "actions";

        const naviBtn = document.createElement("button");
        naviBtn.className = "btn btn-mini-kakao";
        naviBtn.type = "button";
        naviBtn.textContent = "카카오내비";
        naviBtn.onclick = () => openKakaoNavi(stop);

        const focusBtn = document.createElement("button");
        focusBtn.className = "btn btn-sub";
        focusBtn.type = "button";
        focusBtn.textContent = "이 정류장 선택";
        focusBtn.onclick = () => {
          activeIndex = idx;
          render();
        };

        actions.appendChild(naviBtn);
        actions.appendChild(focusBtn);

        card.appendChild(info);
        card.appendChild(actions);
        listEl.appendChild(card);
      });
    }

    function startGpsWatch() {
      const statusEl = document.getElementById("gpsStatus");
      const coordEl = document.getElementById("gpsCoord");

      if (!navigator.geolocation) {
        statusEl.textContent = "GPS 미지원";
        statusEl.className = "gps-badge warn";
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          statusEl.textContent = "GPS 연결됨";
          statusEl.className = "gps-badge";
          coordEl.textContent = `총 19곳 · 현재 좌표: ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (반경 ${ARRIVAL_RADIUS_METERS}m 진입 시 자동 강조)`;

          STOPS.forEach((stop, idx) => {
            if (typeof stop.lat === "number" && typeof stop.lng === "number") {
              const dist = getDistanceMeters(latitude, longitude, stop.lat, stop.lng);
              latestDistances[idx] = dist;

              if (dist <= ARRIVAL_RADIUS_METERS) {
                passedSet.add(idx);
                if (idx >= activeIndex && idx < STOPS.length - 1) {
                  activeIndex = idx + 1;
                }
              }
            }
          });

          render();
        },
        (err) => {
          statusEl.textContent = "위치 확인 필요";
          statusEl.className = "gps-badge warn";
          coordEl.textContent = `위치 안내: ${err.message} (브라우저 위치 권한을 허용해 주세요)`;
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    document.getElementById("prevBtn").onclick = () => {
      if (activeIndex > 0) activeIndex -= 1;
      render();
    };
    document.getElementById("nextBtn").onclick = () => {
      if (activeIndex < STOPS.length - 1) activeIndex += 1;
      render();
    };
    document.getElementById("resetBtn").onclick = () => {
      activeIndex = 0;
      passedSet.clear();
      render();
    };

    render();
    startGpsWatch();
  </script>
</body>
</html>
