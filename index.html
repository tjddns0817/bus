<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>통근버스 노선 및 길안내 테스트</title>
  <!-- 무료 오픈소스 지도 라이브러리 (API 키 불필요) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
    body { background: #111827; color: #f9fafb; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 상단 헤더 & 다음 정류장 카드 */
    header { background: #1f2937; padding: 12px 16px; border-bottom: 1px solid #374151; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { background: #2563eb; color: #fff; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 12px; }
    .gps-status { font-size: 12px; color: #9ca3af; }
    .gps-status.active { color: #34d399; font-weight: bold; }

    .next-stop-box { background: #111827; border: 1px solid #3b82f6; border-radius: 10px; padding: 12px; }
    .next-label { font-size: 12px; color: #60a5fa; font-weight: bold; }
    .next-title { font-size: 20px; font-weight: 800; margin: 4px 0; color: #ffffff; }
    .next-meta { font-size: 13px; color: #d1d5db; display: flex; justify-content: space-between; }

    /* 내비게이션 연동 버튼 영역 */
    .nav-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
    .btn { border: none; border-radius: 8px; padding: 10px 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-kakao { background: #fee500; color: #191919; }
    .btn-tmap { background: #ef4444; color: #ffffff; }
    .btn-pass { background: #374151; color: #f3f4f6; }
    .btn:active { opacity: 0.8; }

    /* 지도 영역 */
    #map { flex: 1; width: 100%; z-index: 1; }

    /* 하단 정류장 목록 서랍 */
    .stop-list-container { height: 34%; background: #1f2937; border-top: 1px solid #374151; overflow-y: auto; padding: 10px 14px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #9ca3af; }
    .stop-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; margin-bottom: 6px; background: #111827; border-radius: 8px; border-left: 4px solid #4b5563; }
    .stop-item.current { border-left-color: #3b82f6; background: #1e293b; }
    .stop-item.passed { opacity: 0.45; border-left-color: #10b981; }
    .stop-info { display: flex; align-items: center; gap: 10px; }
    .stop-num { width: 24px; height: 24px; border-radius: 50%; background: #374151; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .stop-item.current .stop-num { background: #3b82f6; color: #fff; }
    .stop-name { font-size: 14px; font-weight: 600; }
    .stop-time { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <span class="badge">주안 법원 노선</span>
      <span id="gpsStatus" class="gps-status">📡 GPS 수신 대기 중...</span>
    </div>

    <div class="next-stop-box">
      <div class="next-label" id="nextLabel">다음 목표 정류장 (1 / 5)</div>
      <div class="next-title" id="nextStopName">정류장 로딩 중...</div>
      <div class="next-meta">
        <span id="nextStopDesc">예정 시각: --:--</span>
        <span id="distanceInfo">남은 거리: 계산 중</span>
      </div>

      <div class="nav-actions">
        <button class="btn btn-kakao" onclick="openKakaoNavi()">카카오맵/내비</button>
        <button class="btn btn-tmap" onclick="openTmap()">티맵 길안내</button>
        <button class="btn btn-pass" onclick="completeCurrentStop()">정류장 통과 ➔</button>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <div class="stop-list-container">
    <div class="list-header">
      <span>전체 정류장 목록 (터치 시 목표 변경)</span>
      <button onclick="resetRoute()" style="background:none;border:none;color:#60a5fa;font-size:12px;cursor:pointer;">노선 초기화</button>
    </div>
    <div id="stopList"></div>
  </div>

  <script>
    // ==========================================
    // 1. 통근버스 정류장 데이터 (실제 좌표로 수정 가능)
    // ==========================================
    const STOPS = [
      { id: 1, name: "1. 주안역 ", time: "08:30", lat: 37.46, lng: 126.68 },
      { id: 2, name: "2. 옛시민회관", time: "08:33", lat: 37.46, lng: 126.68 },
      { id: 3, name: "3. 인천지방법원", time: "08:47", lat: 37.44, lng: 126.66 },
    ];

    const AUTO_PASS_RADIUS_M = 100; // 정류장 반경 100m 이내 진입 시 자동 통과 처리
    let currentStopIndex = 0;
    let currentBusPos = null;
    let map, busMarker, routeLine;
    let stopMarkers = [];

    // ==========================================
    // 2. 지도 초기화 및 노선 그리기
    // ==========================================
    function initMap() {
      map = L.map('map').setView([STOPS[0].lat, STOPS[0].lng], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // 정류장 마커 및 노선 연결선 생성
      const latlngs = [];
      STOPS.forEach((stop, index) => {
        const pos = [stop.lat, stop.lng];
        latlngs.push(pos);

        const marker = L.circleMarker(pos, {
          radius: 8,
          fillColor: index === 0 ? "#3b82f6" : "#6b7280",
          color: "#ffffff",
          weight: 2,
          fillOpacity: 0.9
        }).addTo(map).bindPopup(`<b>${stop.name}</b><br>예정: ${stop.time}`);

        stopMarkers.push(marker);
      });

      routeLine = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.7, dashArray: '8, 8' }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    }

    // ==========================================
    // 3. 실시간 스마트폰 GPS 추적
    // ==========================================
    function startGPS() {
      const statusEl = document.getElementById('gpsStatus');
      if (!navigator.geolocation) {
        statusEl.textContent = "❌ GPS 미지원 브라우저";
        return;
      }

      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          currentBusPos = { lat, lng };

          statusEl.textContent = `🟢 GPS 수신중 (오차 ${Math.round(position.coords.accuracy)}m)`;
          statusEl.classList.add('active');

          updateBusMarker(lat, lng);
          checkGeofenceAndDistance();
        },
        (err) => {
          statusEl.textContent = "⚠️ 위치 권한을 허용해 주세요";
          statusEl.classList.remove('active');
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    function updateBusMarker(lat, lng) {
      const busIcon = L.divIcon({
        html: '<div style="font-size:24px; line-height:1;">🚌</div>',
        className: 'bus-emoji-icon',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      if (!busMarker) {
        busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
      } else {
        busMarker.setLatLng([lat, lng]);
      }
    }

    // ==========================================
    // 4. 거리 계산 및 반경 진입 자동 통과(지오펜싱)
    // ==========================================
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function checkGeofenceAndDistance() {
      if (!currentBusPos || currentStopIndex >= STOPS.length) return;

      const target = STOPS[currentStopIndex];
      const dist = getDistanceMeters(currentBusPos.lat, currentBusPos.lng, target.lat, target.lng);
      
      const distText = dist >= 1000 ? `${(dist / 1000).toFixed(1)} km` : `${Math.round(dist)} m`;
      document.getElementById('distanceInfo').textContent = `남은 거리: ${distText}`;

      // 목표 정류장 반경 이내 진입 시 자동 다음 정류장 전환
      if (dist <= AUTO_PASS_RADIUS_M) {
        completeCurrentStop(true);
      }
    }

    // ==========================================
    // 5. 정류장 상태 업데이트 및 음성 안내(TTS)
    // ==========================================
    function renderUI() {
      const listEl = document.getElementById('stopList');
      listEl.innerHTML = '';

      STOPS.forEach((stop, idx) => {
        const div = document.createElement('div');
        div.className = 'stop-item' + (idx === currentStopIndex ? ' current' : '') + (idx < currentStopIndex ? ' passed' : '');
        div.onclick = () => { currentStopIndex = idx; renderUI(); };
        div.innerHTML = `
          <div class="stop-info">
            <div class="stop-num">${idx < currentStopIndex ? '✓' : stop.id}</div>
            <div>
              <div class="stop-name">${stop.name}</div>
              <div class="stop-time">도착 예정 ${stop.time}</div>
            </div>
          </div>
          <span style="font-size:12px; color:#60a5fa;">${idx === currentStopIndex ? '안내중' : ''}</span>
        `;
        listEl.appendChild(div);

        // 지도 마커 색상 갱신
        if (stopMarkers[idx]) {
          stopMarkers[idx].setStyle({
            fillColor: idx < currentStopIndex ? "#10b981" : (idx === currentStopIndex ? "#3b82f6" : "#6b7280")
          });
        }
      });

      if (currentStopIndex < STOPS.length) {
        const target = STOPS[currentStopIndex];
        document.getElementById('nextLabel').textContent = `다음 목표 정류장 (${currentStopIndex + 1} / ${STOPS.length})`;
        document.getElementById('nextStopName').textContent = target.name;
        document.getElementById('nextStopDesc').textContent = `예정 시각: ${target.time}`;
        checkGeofenceAndDistance();
      } else {
        document.getElementById('nextLabel').textContent = "운행 상태";
        document.getElementById('nextStopName').textContent = "🏁 모든 정류장 운행 완료";
        document.getElementById('nextStopDesc').textContent = "수고하셨습니다";
        document.getElementById('distanceInfo').textContent = "-";
      }
    }

    function completeCurrentStop(isAuto = false) {
      if (currentStopIndex >= STOPS.length) return;
      currentStopIndex++;
      renderUI();

      if (currentStopIndex < STOPS.length) {
        const nextStop = STOPS[currentStopIndex];
        speak(`다음 정류장은 ${nextStop.name} 입니다.`);
        map.panTo([nextStop.lat, nextStop.lng]);
      } else {
        speak("종점에 도착하여 운행을 종료합니다.");
      }
    }

    function resetRoute() {
      currentStopIndex = 0;
      renderUI();
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.05;
        window.speechSynthesis.speak(msg);
      }
    }

    // ==========================================
    // 6. 외부 내비게이션(카카오맵 / 티맵) 길안내 실행
    // ==========================================
    function openKakaoNavi() {
      if (currentStopIndex >= STOPS.length) return alert("운행이 종료되었습니다.");
      const target = STOPS[currentStopIndex];
      // 카카오맵 길안내 URL 스킴 (모바일에서 앱 자동 실행)
      const url = `https://map.kakao.com/link/to/${encodeURIComponent(target.name)},${target.lat},${target.lng}`;
      window.open(url, '_blank');
    }

    function openTmap() {
      if (currentStopIndex >= STOPS.length) return alert("운행이 종료되었습니다.");
      const target = STOPS[currentStopIndex];
      // 티맵 URL 스킴 (모바일 앱 설치 시 바로 길안내 시작)
      const url = `tmap://route?goalname=${encodeURIComponent(target.name)}&goaly=${target.lat}&goalx=${target.lng}`;
      window.location.href = url;
    }

    // 실행
    initMap();
    renderUI();
    startGPS();
  </script>
</body>
</html>
